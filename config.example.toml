# Konfigurasi MikroTik Universal Rust Gateway Engine
# Gateway dapat berjalan secara stateless (multi-tenant) via Header HTTP X-Router-Host,
# atau menggunakan slot router terdaftar di bawah ini:

listen = "0.0.0.0:8080"
api_token = "change-me-to-a-long-random-string"

# Opsional: Daftarkan router tetap jika diperlukan
# [[router]]
# id = "main"
# addr = "192.168.88.1:8728"
# user = "admin"
# password = ""
