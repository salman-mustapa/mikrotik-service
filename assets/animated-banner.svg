<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Laser Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="corePillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#31104b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.25" />
    </filter>

    <filter id="rustGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f97316" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes beacon {
        0% { r: 4px; opacity: 1; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes packetFly {
        0% { offset-distance: 0%; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .laser-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 2s linear infinite;
      }
      .laser-fast {
        stroke-dasharray: 6 8;
        animation: dashFlow 1.2s linear infinite;
      }
      .pulsing-badge {
        animation: pulseGlow 3s ease-in-out infinite;
        transform-origin: center;
      }
      .beacon-ring {
        animation: beacon 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .font-tech {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="460" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Cyber Grid Background Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="400" y1="0" x2="400" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
    <line x1="800" y1="0" x2="800" y2="460" />
    <line x1="1000" y1="0" x2="1000" y2="460" />
  </g>

  <!-- Glowing Connection Data Lines -->
  <!-- Left Clients -> Central Rust Core -->
  <path d="M 230 180 L 370 230" fill="none" stroke="#38bdf8" stroke-width="2" class="laser-line" />
  <path d="M 230 250 L 370 230" fill="none" stroke="#a855f7" stroke-width="2" class="laser-line" />
  <path d="M 230 320 L 370 230" fill="none" stroke="#10b981" stroke-width="2" class="laser-line" />

  <!-- Central Rust Core -> Right MikroTik Routers -->
  <path d="M 830 230 L 970 170" fill="none" stroke="#06b6d4" stroke-width="2.5" class="laser-fast" />
  <path d="M 830 230 L 970 250" fill="none" stroke="#f97316" stroke-width="2.5" class="laser-fast" />
  <path d="M 830 230 L 970 330" fill="none" stroke="#3b82f6" stroke-width="2.5" class="laser-fast" />

  <!-- ================= TOP HEADER BANNER ================= -->
  <g transform="translate(60, 48)">
    <!-- Sub-badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#38bdf8" />
    <circle cx="12" cy="12" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon-ring" />
    <text x="24" y="16" fill="#93c5fd" font-size="11" font-weight="700" class="font-tech" letter-spacing="1">ENTERPRISE NOC ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="54" fill="#ffffff" font-size="28" font-weight="800" class="font-tech" letter-spacing="-0.5">
      🦀 MikroTik Universal Rust Gateway
    </text>
    <text x="0" y="74" fill="#94a3b8" font-size="13" class="font-tech">
      High-performance sub-millisecond bridge connecting any web, mobile &amp; backend stack to RouterOS.
    </text>
  </g>

  <!-- ================= LEFT COLUMN: CLIENT STACKS ================= -->
  <g transform="translate(60, 150)">
    <!-- Web Client Card -->
    <g transform="translate(0, 0)">
      <rect width="170" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadowGlow)" />
      <rect x="10" y="11" width="32" height="32" rx="6" fill="#0284c7" />
      <text x="26" y="32" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" class="font-tech">⚛</text>
      <text x="50" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="font-tech">Web Clients</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-tech">Vue · React · Next.js</text>
    </g>

    <!-- Backend API Card -->
    <g transform="translate(0, 70)">
      <rect width="170" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="10" y="11" width="32" height="32" rx="6" fill="#7c3aed" />
      <text x="26" y="32" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font-tech">⚡</text>
      <text x="50" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="font-tech">Backend Services</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-tech">Laravel · Express · Go</text>
    </g>

    <!-- Mobile Apps Card -->
    <g transform="translate(0, 140)">
      <rect width="170" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="10" y="11" width="32" height="32" rx="6" fill="#059669" />
      <text x="26" y="32" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font-tech">📱</text>
      <text x="50" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="font-tech">Mobile Apps</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-tech">Flutter · Kotlin · Swift</text>
    </g>
  </g>

  <!-- ================= CENTER: RUST UNIVERSAL ENGINE ================= -->
  <g transform="translate(370, 140)" class="pulsing-badge">
    <!-- Big Rust Hub Container -->
    <rect width="460" height="180" rx="16" fill="url(#corePillGrad)" stroke="#818cf8" stroke-width="1.8" filter="url(#shadowGlow)" />
    
    <!-- Header inside Hub -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#f97316" filter="url(#rustGlow)" />
      <text x="17" y="23" fill="#ffffff" font-size="18" text-anchor="middle">🦀</text>
      <text x="44" y="18" fill="#ffffff" font-size="15" font-weight="800" class="font-tech">Rust Core Multiplexing Gateway</text>
      <text x="44" y="32" fill="#a5b4fc" font-size="11" class="font-tech">Zero TCP Connection Churn · Sub-Millisecond Binary Wire</text>
    </g>

    <!-- Feature Grid Pills inside Rust Hub -->
    <g transform="translate(20, 72)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" font-size="10" font-weight="700" class="font-tech">15s Anti-Hang Guard</text>
      <text x="12" y="29" fill="#94a3b8" font-size="9" class="font-tech">Zero CPU Freeze</text>

      <!-- Pill 2 -->
      <rect x="143" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
      <text x="155" y="17" fill="#f43f5e" font-size="10" font-weight="700" class="font-tech">Anti-Tethering TTL=1</text>
      <text x="155" y="29" fill="#94a3b8" font-size="9" class="font-tech">Block QR &amp; Bluetooth</text>

      <!-- Pill 3 -->
      <rect x="286" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
      <text x="298" y="17" fill="#10b981" font-size="10" font-weight="700" class="font-tech">PCC Load Balancing</text>
      <text x="298" y="29" fill="#94a3b8" font-size="9" class="font-tech">Multi-WAN 1-Click</text>

      <!-- Pill 4 -->
      <rect x="0" y="44" width="135" height="36" rx="8" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
      <text x="12" y="61" fill="#eab308" font-size="10" font-weight="700" class="font-tech">App &amp; Content Blocker</text>
      <text x="12" y="73" fill="#94a3b8" font-size="9" class="font-tech">WA, TikTok, YouTube</text>

      <!-- Pill 5 -->
      <rect x="143" y="44" width="135" height="36" rx="8" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
      <text x="155" y="61" fill="#a855f7" font-size="10" font-weight="700" class="font-tech">Queue &amp; Speed Inspect</text>
      <text x="155" y="73" fill="#94a3b8" font-size="9" class="font-tech">Throttling Diagnostics</text>

      <!-- Pill 6 -->
      <rect x="286" y="44" width="135" height="36" rx="8" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
      <text x="298" y="61" fill="#06b6d4" font-size="10" font-weight="700" class="font-tech">FastTrack Optimizer</text>
      <text x="298" y="73" fill="#94a3b8" font-size="9" class="font-tech">80% Less CPU Load</text>
    </g>

    <!-- Bottom Stat Bar inside Rust Hub -->
    <g transform="translate(20, 162)">
      <circle cx="6" cy="6" r="3" fill="#10b981" />
      <text x="16" y="9" fill="#cbd5e1" font-size="10" font-weight="600" class="font-tech">192 Production-Ready REST &amp; WebSocket Endpoints</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: MIKROTIK ROUTEROS ================= -->
  <g transform="translate(970, 150)">
    <!-- RouterBOARD Hardware Card -->
    <g transform="translate(0, 0)">
      <rect width="170" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="10" y="11" width="32" height="32" rx="6" fill="#0284c7" />
      <text x="26" y="32" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font-tech">📶</text>
      <text x="50" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="font-tech">hAP lite / mini / Gr3</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-tech">Budget Home/WISP</text>
    </g>

    <!-- CCR / Heavy Hardware Card -->
    <g transform="translate(0, 70)">
      <rect width="170" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="10" y="11" width="32" height="32" rx="6" fill="#ea580c" />
      <text x="26" y="32" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font-tech">🏢</text>
      <text x="50" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="font-tech">CCR &amp; Cloud Routers</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-tech">Multi-Core NOC / ISP</text>
    </g>

    <!-- Cloud Hosted Router (CHR) Card -->
    <g transform="translate(0, 140)">
      <rect width="170" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="10" y="11" width="32" height="32" rx="6" fill="#4338ca" />
      <text x="26" y="32" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font-tech">☁</text>
      <text x="50" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="font-tech">CHR &amp; x86 RouterOS</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-tech">v6.49 s/d v7.x Stable</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATS TICKER BAR ================= -->
  <g transform="translate(60, 395)">
    <rect width="1080" height="42" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    
    <g transform="translate(24, 25)">
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" class="font-tech">⚡ SUB-MS LATENCY:</text>
      <text x="125" y="0" fill="#f8fafc" font-size="11" class="font-tech">&lt; 1.5ms avg response</text>

      <text x="300" y="0" fill="#10b981" font-size="11" font-weight="700" class="font-tech">🛡️ 15S TIMEOUT GUARD:</text>
      <text x="445" y="0" fill="#f8fafc" font-size="11" class="font-tech">Zero Router CPU Lock</text>

      <text x="615" y="0" fill="#c084fc" font-size="11" font-weight="700" class="font-tech">🏷️ WINBOX LABELS:</text>
      <text x="735" y="0" fill="#f8fafc" font-size="11" class="font-tech">Auto-tagged with [TAG]</text>

      <text x="895" y="0" fill="#fb923c" font-size="11" font-weight="700" class="font-tech">🐳 DOCKER READY:</text>
      <text x="1005" y="0" fill="#f8fafc" font-size="11" class="font-tech">&lt; 25MB Image</text>
    </g>
  </g>
</svg>
