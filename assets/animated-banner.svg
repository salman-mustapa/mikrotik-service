<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Rust Hub Center Gradient -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#2e1065" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="hubGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8b5cf6" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes laserFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes beaconRing {
        0% { r: 3px; opacity: 1; }
        100% { r: 10px; opacity: 0; }
      }
      .laser-left {
        stroke-dasharray: 6 8;
        animation: laserFlow 1.6s linear infinite;
      }
      .laser-right {
        stroke-dasharray: 6 8;
        animation: laserFlow 1.2s linear infinite;
      }
      .beacon {
        animation: beaconRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .shimmer {
        animation: pulseOpacity 2.5s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="180" y1="0" x2="180" y2="520" />
    <line x1="340" y1="0" x2="340" y2="520" />
    <line x1="860" y1="0" x2="860" y2="520" />
    <line x1="1020" y1="0" x2="1020" y2="520" />
  </g>

  <!-- ================= TOP HEADER ================= -->
  <!-- Header Badge -->
  <rect x="60" y="24" width="186" height="24" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
  <circle cx="74" cy="36" r="3.5" fill="#38bdf8" />
  <circle cx="74" cy="36" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon" />
  <text x="86" y="40" fill="#93c5fd" font-size="10.5" font-weight="700" letter-spacing="1">ENTERPRISE NOC ENGINE</text>

  <!-- Header Titles -->
  <text x="60" y="74" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.3">
    🦀 MikroTik Universal Rust Gateway
  </text>
  <text x="60" y="96" fill="#94a3b8" font-size="13">
    High-performance sub-millisecond bridge connecting any web, mobile &amp; backend stack to RouterOS.
  </text>

  <!-- Header Right Status Pill -->
  <rect x="1000" y="32" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="1016" cy="46" r="4" fill="#10b981" />
  <text x="1028" y="50" fill="#38bdf8" font-size="11" font-weight="700">PORT 8080 : LIVE</text>

  <!-- ================= CONNECTING DATA CABLES ================= -->
  <!-- Left to Center Cables -->
  <path d="M 280 162 L 350 200" fill="none" stroke="#38bdf8" stroke-width="2" class="laser-left" />
  <path d="M 280 252 L 350 260" fill="none" stroke="#a855f7" stroke-width="2" class="laser-left" />
  <path d="M 280 342 L 350 320" fill="none" stroke="#10b981" stroke-width="2" class="laser-left" />

  <!-- Center to Right Cables -->
  <path d="M 850 200 L 920 162" fill="none" stroke="#06b6d4" stroke-width="2.5" class="laser-right" />
  <path d="M 850 260 L 920 252" fill="none" stroke="#f97316" stroke-width="2.5" class="laser-right" />
  <path d="M 850 320 L 920 342" fill="none" stroke="#8b5cf6" stroke-width="2.5" class="laser-right" />

  <!-- ================= LEFT COLUMN: CLIENT APPLICATIONS ================= -->
  <!-- Card 1: Web Frontends -->
  <rect x="60" y="125" width="220" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="74" y="141" width="40" height="40" rx="8" fill="#0284c7" />
  <text x="94" y="167" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="bold">🌐</text>
  <text x="124" y="152" fill="#f8fafc" font-size="13" font-weight="700">Web Frontends</text>
  <text x="124" y="168" fill="#94a3b8" font-size="11">Vue · React · Next · Svelte</text>
  <text x="124" y="184" fill="#38bdf8" font-size="9.5" font-weight="600">REST &amp; WebSocket /ws</text>

  <!-- Card 2: Backend APIs -->
  <rect x="60" y="215" width="220" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="74" y="231" width="40" height="40" rx="8" fill="#7c3aed" />
  <text x="94" y="257" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="bold">⚡</text>
  <text x="124" y="242" fill="#f8fafc" font-size="13" font-weight="700">Backend Services</text>
  <text x="124" y="258" fill="#94a3b8" font-size="11">Laravel · Express · Go · Python</text>
  <text x="124" y="274" fill="#c084fc" font-size="9.5" font-weight="600">Standard HTTP POST JSON</text>

  <!-- Card 3: Mobile Apps -->
  <rect x="60" y="305" width="220" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="74" y="321" width="40" height="40" rx="8" fill="#059669" />
  <text x="94" y="347" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="bold">📱</text>
  <text x="124" y="332" fill="#f8fafc" font-size="13" font-weight="700">Mobile Apps</text>
  <text x="124" y="348" fill="#94a3b8" font-size="11">Flutter · Kotlin · Swift · RN</text>
  <text x="124" y="364" fill="#34d399" font-size="9.5" font-weight="600">Direct HTTP &amp; Live Stream</text>

  <!-- ================= CENTER COLUMN: RUST UNIVERSAL ENGINE ================= -->
  <!-- Big Center Hub Box -->
  <rect x="350" y="120" width="500" height="280" rx="14" fill="url(#hubGrad)" stroke="#818cf8" stroke-width="1.6" filter="url(#hubGlow)" />

  <!-- Hub Header -->
  <rect x="372" y="136" width="36" height="36" rx="8" fill="#f97316" />
  <text x="390" y="161" fill="#ffffff" font-size="20" text-anchor="middle">🦀</text>
  <text x="418" y="152" fill="#ffffff" font-size="15" font-weight="800">Rust Core Multiplexing Gateway</text>
  <text x="418" y="168" fill="#cbd5e1" font-size="11.5">Zero TCP Handshake Churn · Sub-Millisecond Binary Wire Protocol</text>

  <!-- 6 Grid Feature Cards inside Hub -->
  <!-- Row 1: Left (15s Timeout Guard) -->
  <rect x="370" y="188" width="146" height="58" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="382" y="208" fill="#38bdf8" font-size="11" font-weight="700">🛡️ 15s Timeout Guard</text>
  <text x="382" y="224" fill="#cbd5e1" font-size="9.5">Zero Router CPU Freeze</text>
  <text x="382" y="238" fill="#64748b" font-size="8.5">Auto Safe Multiplexing</text>

  <!-- Row 1: Middle (Anti-Tethering TTL=1) -->
  <rect x="526" y="188" width="146" height="58" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="538" y="208" fill="#f43f5e" font-size="11" font-weight="700">📵 Anti-Tethering</text>
  <text x="538" y="224" fill="#cbd5e1" font-size="9.5">Mangle TTL=1 Enforced</text>
  <text x="538" y="238" fill="#64748b" font-size="8.5">Block QR &amp; Bluetooth</text>

  <!-- Row 1: Right (PCC Load Balancing) -->
  <rect x="682" y="188" width="148" height="58" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="694" y="208" fill="#10b981" font-size="11" font-weight="700">⚖️ Load Balancing</text>
  <text x="694" y="224" fill="#cbd5e1" font-size="9.5">Multi-WAN PCC 1-Click</text>
  <text x="694" y="238" fill="#64748b" font-size="8.5">Auto Ping Failover</text>

  <!-- Row 2: Left (App & Content Blocker) -->
  <rect x="370" y="256" width="146" height="58" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="382" y="276" fill="#eab308" font-size="11" font-weight="700">🚫 App Blocker</text>
  <text x="382" y="292" fill="#cbd5e1" font-size="9.5">WA, TikTok, YouTube</text>
  <text x="382" y="306" fill="#64748b" font-size="8.5">Judi &amp; Torrent 1-Click</text>

  <!-- Row 2: Middle (Queue Speed Inspect) -->
  <rect x="526" y="256" width="146" height="58" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="538" y="276" fill="#c084fc" font-size="11" font-weight="700">🔍 Queue Inspector</text>
  <text x="538" y="292" fill="#cbd5e1" font-size="9.5">Live Speed &amp; Quota</text>
  <text x="538" y="306" fill="#64748b" font-size="8.5">Throttling Diagnostic</text>

  <!-- Row 2: Right (FastTrack Optimizer) -->
  <rect x="682" y="256" width="148" height="58" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="694" y="276" fill="#06b6d4" font-size="11" font-weight="700">🚀 FastTrack Boost</text>
  <text x="694" y="292" fill="#cbd5e1" font-size="9.5">80% Less CPU Load</text>
  <text x="694" y="306" fill="#64748b" font-size="8.5">Budget Router Saver</text>

  <!-- Hub Bottom Indicator Bar -->
  <rect x="370" y="332" width="460" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="386" cy="349" r="4" fill="#10b981" class="shimmer" />
  <text x="398" y="353" fill="#cbd5e1" font-size="11" font-weight="600">
    192 Enterprise REST &amp; WebSocket Endpoints · Dynamic Multi-Router Connection Pool
  </text>

  <!-- ================= RIGHT COLUMN: MIKROTIK ROUTEROS ================= -->
  <!-- Card 1: Budget Routers -->
  <rect x="920" y="125" width="220" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="934" y="141" width="40" height="40" rx="8" fill="#0284c7" />
  <text x="954" y="167" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="bold">📶</text>
  <text x="984" y="152" fill="#f8fafc" font-size="13" font-weight="700">hAP lite / mini / Gr3</text>
  <text x="984" y="168" fill="#94a3b8" font-size="11">Budget Home / WISP Site</text>
  <text x="984" y="184" fill="#38bdf8" font-size="9.5" font-weight="600">Port 8728 · FastTrack Guard</text>

  <!-- Card 2: CCR / Core Routers -->
  <rect x="920" y="215" width="220" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="934" y="231" width="40" height="40" rx="8" fill="#ea580c" />
  <text x="954" y="257" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="bold">🏢</text>
  <text x="984" y="242" fill="#f8fafc" font-size="13" font-weight="700">CCR &amp; Cloud Routers</text>
  <text x="984" y="258" fill="#94a3b8" font-size="11">Multi-Core NOC / ISP Edge</text>
  <text x="984" y="274" fill="#fb923c" font-size="9.5" font-weight="600">High-Throughput Parallel Tags</text>

  <!-- Card 3: Cloud Hosted (CHR) -->
  <rect x="920" y="305" width="220" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="934" y="321" width="40" height="40" rx="8" fill="#4338ca" />
  <text x="954" y="347" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="bold">☁️</text>
  <text x="984" y="332" fill="#f8fafc" font-size="13" font-weight="700">CHR &amp; x86 RouterOS</text>
  <text x="984" y="348" fill="#94a3b8" font-size="11">AWS · Hetzner · DigitalOcean</text>
  <text x="984" y="364" fill="#a5b4fc" font-size="9.5" font-weight="600">RouterOS v6.49 s/d v7.x</text>

  <!-- ================= BOTTOM STATS TICKER BAR ================= -->
  <rect x="60" y="430" width="1080" height="48" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  
  <text x="86" y="460" fill="#38bdf8" font-size="11.5" font-weight="700">⚡ SUB-MS LATENCY:</text>
  <text x="218" y="460" fill="#f8fafc" font-size="11.5">&lt; 1.5ms avg response</text>

  <text x="370" y="460" fill="#10b981" font-size="11.5" font-weight="700">🛡️ 15S TIMEOUT GUARD:</text>
  <text x="522" y="460" fill="#f8fafc" font-size="11.5">Zero Router CPU Lock</text>

  <text x="686" y="460" fill="#c084fc" font-size="11.5" font-weight="700">🏷️ WINBOX LABELS:</text>
  <text x="806" y="460" fill="#f8fafc" font-size="11.5">Auto-tagged [TAG]</text>

  <text x="946" y="460" fill="#fb923c" font-size="11.5" font-weight="700">🐳 DOCKER READY:</text>
  <text x="1056" y="460" fill="#f8fafc" font-size="11.5">&lt; 25MB Image</text>

</svg>
