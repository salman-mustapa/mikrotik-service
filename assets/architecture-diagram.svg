<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Column Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Rust Core Column Gradient -->
    <linearGradient id="rustCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#2a0845" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f97316" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 400; fill: #94a3b8; }
    .h2 { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 700; fill: #f1f5f9; }
    .text-sm { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 500; font-size: 11.5px; fill: #cbd5e1; }
    .text-xs { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 400; font-size: 10.5px; fill: #94a3b8; }
    .badge { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background Base Canvas -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100" />
    <line x1="0" y1="200" x2="1280" y2="200" />
    <line x1="0" y1="300" x2="1280" y2="300" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="500" x2="1280" y2="500" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="360" y1="0" x2="360" y2="720" />
    <line x1="560" y1="0" x2="560" y2="720" />
    <line x1="760" y1="0" x2="760" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1160" y1="0" x2="1160" y2="720" />
  </g>

  <!-- ================= TOP HEADER BANNER ================= -->
  <rect x="40" y="28" width="40" height="40" rx="9" fill="#f97316" />
  <text x="60" y="55" text-anchor="middle" font-size="22" fill="#ffffff">🦀</text>
  <text x="94" y="44" class="title" font-size="21">MikroTik Universal Rust Core &amp; Gateway Architecture</text>
  <text x="94" y="62" class="subtitle" font-size="12.5">High-Performance Sub-Millisecond Gateway with Dynamic Connection Pool &amp; Tag Multiplexing</text>
  
  <rect x="1080" y="34" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" />
  <circle cx="1096" cy="48" r="4" fill="#10b981" />
  <text x="1108" y="52" class="badge" fill="#38bdf8">PORT 8080 : ACTIVE</text>

  <!-- ================= LEFT COLUMN: CLIENT APPLICATIONS (Width: 270) ================= -->
  <!-- Outer Frame -->
  <rect x="40" y="90" width="270" height="590" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Column Title -->
  <rect x="56" y="106" width="238" height="34" rx="7" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
  <text x="175" y="128" text-anchor="middle" class="h2" font-size="12" fill="#e2e8f0">CLIENT APPLICATIONS</text>
  <text x="175" y="154" text-anchor="middle" class="text-xs" fill="#64748b">Any Programming Stack</text>

  <!-- Card 1: Web Frontends -->
  <rect x="56" y="168" width="238" height="88" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="78" cy="192" r="12" fill="#0369a1" />
  <text x="78" y="197" text-anchor="middle" font-size="13" fill="#ffffff">🌐</text>
  <text x="98" y="190" class="h2" font-size="12.5">Web Frontends</text>
  <text x="98" y="204" class="text-xs">React, Vue.js, Angular, Svelte</text>
  <rect x="68" y="218" width="214" height="24" rx="5" fill="#1e293b" />
  <text x="175" y="234" text-anchor="middle" class="badge" fill="#38bdf8">HTTP REST / WebSocket / SSE</text>

  <!-- Card 2: Mobile Apps -->
  <rect x="56" y="270" width="238" height="88" rx="9" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="78" cy="294" r="12" fill="#6b21a8" />
  <text x="78" y="299" text-anchor="middle" font-size="13" fill="#ffffff">📱</text>
  <text x="98" y="292" class="h2" font-size="12.5">Mobile Applications</text>
  <text x="98" y="306" class="text-xs">Flutter, React Native, iOS, Android</text>
  <rect x="68" y="320" width="214" height="24" rx="5" fill="#1e293b" />
  <text x="175" y="336" text-anchor="middle" class="badge" fill="#c084fc">Direct WS / HTTPS Stream</text>

  <!-- Card 3: Backend Services -->
  <rect x="56" y="372" width="238" height="88" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="78" cy="396" r="12" fill="#047857" />
  <text x="78" y="401" text-anchor="middle" font-size="13" fill="#ffffff">⚙️</text>
  <text x="98" y="394" class="h2" font-size="12.5">Backend Servers</text>
  <text x="98" y="408" class="text-xs">Laravel, Node.js, Go, Python</text>
  <rect x="68" y="422" width="214" height="24" rx="5" fill="#1e293b" />
  <text x="175" y="438" text-anchor="middle" class="badge" fill="#34d399">Standard HTTP JSON Client</text>

  <!-- Universal Credentials Box -->
  <rect x="56" y="474" width="238" height="188" rx="9" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 3" />
  <text x="70" y="496" class="badge" fill="#a5b4fc">UNIVERSAL HEADERS / PARAMS:</text>
  <text x="70" y="516" class="text-xs" fill="#cbd5e1">• X-Router-Host : 192.168.88.1</text>
  <text x="70" y="534" class="text-xs" fill="#cbd5e1">• X-Router-Port : 8728 / 51121</text>
  <text x="70" y="552" class="text-xs" fill="#cbd5e1">• X-Router-User : admin</text>
  <text x="70" y="570" class="text-xs" fill="#cbd5e1">• X-Router-Pass : ••••••••</text>
  <text x="70" y="588" class="text-xs" fill="#93c5fd">• URL Query : ?host=..&amp;token=..</text>
  
  <rect x="68" y="604" width="214" height="44" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="0.8" />
  <text x="175" y="622" text-anchor="middle" class="badge" fill="#38bdf8">Dynamic Connection Pool</text>
  <text x="175" y="638" text-anchor="middle" class="text-xs" fill="#94a3b8">Multi-tenant per-request routing</text>

  <!-- ================= MIDDLE COLUMN: RUST UNIVERSAL GATEWAY (Width: 560) ================= -->
  <!-- Column Outer Frame -->
  <rect x="360" y="90" width="560" height="590" rx="14" fill="url(#rustCoreGrad)" stroke="#818cf8" stroke-width="1.6" filter="url(#cardShadow)" />

  <!-- Column Title -->
  <rect x="380" y="104" width="520" height="32" rx="7" fill="#1e293b" stroke="#6366f1" stroke-width="0.8" />
  <text x="640" y="125" text-anchor="middle" class="h2" font-size="12.5" fill="#c7d2fe">RUST CORE GATEWAY ENGINE (TOKIO ASYNC)</text>

  <!-- Sub-Block 1: Ingress Layer -->
  <rect x="380" y="148" width="520" height="76" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="396" y="167" class="badge" fill="#38bdf8">1. INGRESS &amp; PROTOCOL INTERFACES</text>
  
  <rect x="396" y="176" width="156" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
  <text x="474" y="191" text-anchor="middle" class="h2" font-size="10.5">REST API Engine</text>
  <text x="474" y="205" text-anchor="middle" class="badge" fill="#94a3b8">115+ Enterprise Endpoints</text>

  <rect x="562" y="176" width="156" height="38" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.8" />
  <text x="640" y="191" text-anchor="middle" class="h2" font-size="10.5">WebSocket (/ws)</text>
  <text x="640" y="205" text-anchor="middle" class="badge" fill="#34d399">Full-Duplex Stream</text>

  <rect x="728" y="176" width="156" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" />
  <text x="806" y="191" text-anchor="middle" class="h2" font-size="10.5">SSE Stream (/listen)</text>
  <text x="806" y="205" text-anchor="middle" class="badge" fill="#fbbf24">EventSource Pipe</text>

  <!-- Sub-Block 2: Speed Engines & Fast-Path -->
  <rect x="380" y="234" width="520" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <circle cx="396" cy="251" r="4" fill="#10b981" />
  <text x="408" y="255" class="badge" fill="#34d399">2. SPEED ENGINES &amp; TIMEOUT PROTECTION</text>
  
  <rect x="396" y="264" width="242" height="50" rx="6" fill="#1e293b" />
  <text x="410" y="281" class="h2" font-size="11.5" fill="#f8fafc">Fast-Path /overview</text>
  <text x="410" y="295" class="text-xs" fill="#94a3b8">tokio::join! concurrent 6x queries</text>
  <text x="410" y="307" class="badge" fill="#10b981">&lt; 1.5ms Snapshot</text>

  <rect x="648" y="264" width="236" height="50" rx="6" fill="#1e293b" />
  <text x="662" y="281" class="h2" font-size="11.5" fill="#f8fafc">15s Anti-Hang Guard</text>
  <text x="662" y="295" class="text-xs" fill="#94a3b8">Prevents router CPU locks</text>
  <text x="662" y="307" class="badge" fill="#38bdf8">Zero Freeze Guarantee</text>

  <!-- Sub-Block 3: Dynamic Persistent Connection Pool -->
  <rect x="380" y="334" width="520" height="142" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1.2" />
  <circle cx="396" cy="351" r="4" fill="#ea580c" />
  <text x="408" y="355" class="badge" fill="#fb923c">3. DYNAMIC PERSISTENT CONNECTION POOL</text>
  
  <text x="396" y="372" class="text-xs" fill="#cbd5e1">Maintains warm authenticated TCP sockets per target router in memory</text>
  <text x="396" y="387" class="text-xs" fill="#94a3b8">Managed via thread-safe Arc&lt;Mutex&lt;Pool&gt;&gt; for zero-handshake dispatch</text>

  <rect x="396" y="398" width="242" height="66" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="0.8" />
  <text x="410" y="416" class="h2" font-size="11">Zero Handshake Churn</text>
  <text x="410" y="432" class="text-xs" fill="#cbd5e1">No TCP teardown delay</text>
  <text x="410" y="449" class="badge" fill="#f97316">Saved: ~45ms per request</text>

  <rect x="648" y="398" width="236" height="66" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="0.8" />
  <text x="662" y="416" class="h2" font-size="11">Zero Re-Auth MD5</text>
  <text x="662" y="432" class="text-xs" fill="#cbd5e1">No redundant challenge hash</text>
  <text x="662" y="449" class="badge" fill="#f97316">Saved: ~30ms CPU load</text>

  <!-- Sub-Block 4: Wire Codec & .tag Multiplexer -->
  <rect x="380" y="486" width="520" height="174" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
  <circle cx="396" cy="503" r="4" fill="#6366f1" />
  <text x="408" y="507" class="badge" fill="#818cf8">4. WIRE CODEC &amp; .tag MULTIPLEXER</text>
  
  <text x="396" y="524" class="text-xs" fill="#cbd5e1">Pipelines concurrent requests on a single socket using atomic .tag</text>
  <text x="396" y="539" class="text-xs" fill="#94a3b8">Decodes RouterOS wire sentences directly to caller async Tokio channels</text>

  <rect x="396" y="552" width="156" height="96" rx="6" fill="#1e293b" />
  <text x="410" y="574" class="h2" font-size="11">Tag #101</text>
  <text x="410" y="594" class="text-xs">/ip/address</text>
  <rect x="410" y="612" width="80" height="22" rx="4" fill="#064e3b" />
  <text x="450" y="627" text-anchor="middle" class="badge" fill="#34d399">HTTP Res</text>

  <rect x="562" y="552" width="156" height="96" rx="6" fill="#1e293b" />
  <text x="576" y="574" class="h2" font-size="11">Tag #102</text>
  <text x="576" y="594" class="text-xs">monitor-traffic</text>
  <rect x="576" y="612" width="82" height="22" rx="4" fill="#0c4a6e" />
  <text x="617" y="627" text-anchor="middle" class="badge" fill="#38bdf8">WS Stream</text>

  <rect x="728" y="552" width="156" height="96" rx="6" fill="#1e293b" />
  <text x="742" y="574" class="h2" font-size="11">Tag #103</text>
  <text x="742" y="594" class="text-xs">hotspot/active</text>
  <rect x="742" y="612" width="80" height="22" rx="4" fill="#78350f" />
  <text x="782" y="627" text-anchor="middle" class="badge" fill="#fbbf24">Overview</text>

  <!-- ================= RIGHT COLUMN: MIKROTIK ROUTEROS (Width: 270) ================= -->
  <!-- Outer Frame -->
  <rect x="970" y="90" width="270" height="590" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Column Title -->
  <rect x="986" y="106" width="238" height="34" rx="7" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
  <text x="1105" y="128" text-anchor="middle" class="h2" font-size="12" fill="#e2e8f0">MIKROTIK ROUTEROS FLEET</text>
  <text x="1105" y="154" text-anchor="middle" class="text-xs" fill="#64748b">RouterOS v6 &amp; v7 Hardware/Cloud</text>

  <!-- Card 1: Local Hardware -->
  <rect x="986" y="168" width="238" height="88" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <circle cx="1008" cy="192" r="12" fill="#047857" />
  <text x="1008" y="197" text-anchor="middle" font-size="13" fill="#ffffff">📡</text>
  <text x="1028" y="190" class="h2" font-size="12.5">Local Hardware</text>
  <text x="1028" y="206" class="text-xs">CCR / RB4011 / hEX / hAP</text>
  <rect x="998" y="218" width="214" height="24" rx="5" fill="#1e293b" />
  <text x="1105" y="234" text-anchor="middle" class="badge" fill="#34d399">PORT 8728 (API Wire Protocol)</text>

  <!-- Card 2: Remote / VPN Router -->
  <rect x="986" y="270" width="238" height="88" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <circle cx="1008" cy="294" r="12" fill="#0369a1" />
  <text x="1008" y="299" text-anchor="middle" font-size="13" fill="#ffffff">🌐</text>
  <text x="1028" y="292" class="h2" font-size="12.5">Remote Router (VPN)</text>
  <text x="1028" y="308" class="text-xs">Branch Office / Remote Site</text>
  <rect x="998" y="320" width="214" height="24" rx="5" fill="#1e293b" />
  <text x="1105" y="336" text-anchor="middle" class="badge" fill="#38bdf8">PORT 51121 (NAT Forwarded)</text>

  <!-- Card 3: Cloud Hosted (CHR) -->
  <rect x="986" y="372" width="238" height="88" rx="9" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
  <circle cx="1008" cy="396" r="12" fill="#6b21a8" />
  <text x="1008" y="401" text-anchor="middle" font-size="13" fill="#ffffff">☁️</text>
  <text x="1028" y="394" class="h2" font-size="12.5">Cloud Hosted (CHR)</text>
  <text x="1028" y="410" class="text-xs">AWS · Hetzner · Cloud VPS</text>
  <rect x="998" y="422" width="214" height="24" rx="5" fill="#1e293b" />
  <text x="1105" y="438" text-anchor="middle" class="badge" fill="#c084fc">PORT 8729 (API-SSL Encrypted)</text>

  <!-- CPU Protection Metric Box -->
  <rect x="986" y="474" width="238" height="186" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="1002" y="500" class="badge" fill="#6ee7b7">ROUTER CPU SAVINGS:</text>
  <text x="1002" y="528" class="h2" font-size="19" fill="#34d399">~85% CPU Reduction</text>
  <text x="1002" y="554" class="text-xs" fill="#a7f3d0">• Zero voucher disconnect spikes</text>
  <text x="1002" y="576" class="text-xs" fill="#a7f3d0">• FastTrack connection bypass</text>
  <text x="1002" y="598" class="text-xs" fill="#a7f3d0">• Budget router anti-hang safe</text>
  <text x="1002" y="620" class="text-xs" fill="#a7f3d0">• Multi-tenant multiplexed pool</text>

  <!-- ================= FLOW CONNECTORS / ARROWS ================= -->
  <!-- Client to Rust Engine Arrows -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none">
    <path d="M 310 212 L 360 212" marker-end="url(#arrowCyan)" />
    <path d="M 310 314 L 360 314" marker-end="url(#arrowCyan)" />
    <path d="M 310 416 L 360 416" marker-end="url(#arrowCyan)" />
  </g>
  
  <rect x="312" y="252" width="46" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
  <text x="335" y="267" text-anchor="middle" class="badge" fill="#38bdf8">&lt; 1ms</text>

  <!-- Rust Engine to MikroTik Routers Arrows -->
  <g stroke="#f97316" stroke-width="2.5" fill="none">
    <path d="M 920 212 L 970 212" marker-end="url(#arrowOrange)" />
    <path d="M 920 314 L 970 314" marker-end="url(#arrowOrange)" />
    <path d="M 920 416 L 970 416" marker-end="url(#arrowOrange)" />
  </g>

  <rect x="922" y="252" width="46" height="22" rx="4" fill="#0f172a" stroke="#f97316" stroke-width="0.8" />
  <text x="945" y="267" text-anchor="middle" class="badge" fill="#f97316">TCP</text>

</svg>
