<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="rustCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2e1065" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f97316" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f1f5f9; }
    .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #cbd5e1; }
    .text-xs { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect x="0" y="0" width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="0" y1="630" x2="1200" y2="630" />
    <line x1="180" y1="0" x2="180" y2="680" />
    <line x1="360" y1="0" x2="360" y2="680" />
    <line x1="540" y1="0" x2="540" y2="680" />
    <line x1="720" y1="0" x2="720" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
    <line x1="1080" y1="0" x2="1080" y2="680" />
  </g>

  <!-- ================= HEADER BANNER ================= -->
  <rect x="50" y="28" width="38" height="38" rx="8" fill="#f97316" />
  <text x="69" y="54" text-anchor="middle" font-size="22" fill="#ffffff">🦀</text>
  <text x="100" y="44" class="title" font-size="20">MikroTik Universal Rust Core &amp; Gateway Architecture</text>
  <text x="100" y="62" class="subtitle" font-size="12.5">High-Performance Sub-Millisecond Gateway with Dynamic Connection Pool &amp; Tag Multiplexing</text>
  
  <rect x="990" y="32" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" />
  <circle cx="1006" cy="46" r="4" fill="#10b981" />
  <text x="1018" y="50" class="badge" fill="#38bdf8">PORT 8080 : ACTIVE</text>

  <!-- ================= LEFT COLUMN: CLIENT APPLICATIONS ================= -->
  <!-- Outer Frame -->
  <rect x="50" y="90" width="260" height="550" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Column Title -->
  <rect x="66" y="106" width="228" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
  <text x="180" y="127" text-anchor="middle" class="h2" font-size="12" fill="#e2e8f0">CLIENT APPLICATIONS</text>
  <text x="180" y="152" text-anchor="middle" class="text-xs" fill="#64748b">Any Programming Stack</text>

  <!-- Card 1: Web Frontends -->
  <rect x="66" y="165" width="228" height="88" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="88" cy="188" r="12" fill="#0369a1" />
  <text x="88" y="193" text-anchor="middle" font-size="13" fill="#ffffff">🌐</text>
  <text x="108" y="186" class="h2" font-size="12.5">Web Frontends</text>
  <text x="108" y="200" class="text-xs">React, Vue.js, Angular, Svelte</text>
  <rect x="76" y="214" width="208" height="24" rx="5" fill="#1e293b" />
  <text x="86" y="230" class="badge" fill="#38bdf8">HTTP REST / WebSocket / SSE</text>

  <!-- Card 2: Mobile Apps -->
  <rect x="66" y="265" width="228" height="88" rx="9" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="88" cy="288" r="12" fill="#6b21a8" />
  <text x="88" y="293" text-anchor="middle" font-size="13" fill="#ffffff">📱</text>
  <text x="108" y="286" class="h2" font-size="12.5">Mobile Applications</text>
  <text x="108" y="300" class="text-xs">Flutter, React Native, iOS, Android</text>
  <rect x="76" y="314" width="208" height="24" rx="5" fill="#1e293b" />
  <text x="86" y="330" class="badge" fill="#c084fc">Direct WS / HTTPS Stream</text>

  <!-- Card 3: Backend Services -->
  <rect x="66" y="365" width="228" height="88" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="88" cy="388" r="12" fill="#047857" />
  <text x="88" y="393" text-anchor="middle" font-size="13" fill="#ffffff">⚙️</text>
  <text x="108" y="386" class="h2" font-size="12.5">Backend Servers</text>
  <text x="108" y="400" class="text-xs">Laravel, Node.js, Go, Python, Java</text>
  <rect x="76" y="414" width="208" height="24" rx="5" fill="#1e293b" />
  <text x="86" y="430" class="badge" fill="#34d399">Standard HTTP JSON Client</text>

  <!-- Universal Credentials Box -->
  <rect x="66" y="465" width="228" height="155" rx="9" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 3" />
  <text x="80" y="488" class="badge" fill="#a5b4fc">UNIVERSAL PARAMS / HEADERS:</text>
  <text x="80" y="510" class="text-xs" fill="#cbd5e1">• X-Router-Host : 192.168.88.1</text>
  <text x="80" y="528" class="text-xs" fill="#cbd5e1">• X-Router-Port : 8728 / 51121</text>
  <text x="80" y="546" class="text-xs" fill="#cbd5e1">• X-Router-User : admin</text>
  <text x="80" y="564" class="text-xs" fill="#cbd5e1">• X-Router-Pass : ••••••••</text>
  <rect x="76" y="580" width="208" height="26" rx="5" fill="#0f172a" />
  <text x="86" y="597" class="badge" fill="#38bdf8">Dynamic Multi-Tenant Pool</text>

  <!-- ================= MIDDLE COLUMN: RUST UNIVERSAL GATEWAY ================= -->
  <!-- Column Outer Frame -->
  <rect x="360" y="90" width="480" height="550" rx="14" fill="url(#rustCoreGrad)" stroke="#818cf8" stroke-width="1.6" filter="url(#cardShadow)" />

  <!-- Column Title -->
  <rect x="378" y="106" width="444" height="32" rx="7" fill="#1e293b" stroke="#6366f1" stroke-width="0.8" />
  <text x="600" y="127" text-anchor="middle" class="h2" font-size="12" fill="#c7d2fe">RUST CORE GATEWAY ENGINE (TOKIO ASYNC)</text>

  <!-- Sub-Block 1: Ingress Layer -->
  <rect x="378" y="150" width="444" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="392" y="170" class="badge" fill="#38bdf8">1. INGRESS &amp; PROTOCOL INTERFACES</text>
  
  <rect x="392" y="180" width="134" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
  <text x="459" y="197" text-anchor="middle" class="h2" font-size="11">REST API Engine</text>
  <text x="459" y="210" text-anchor="middle" class="badge" fill="#94a3b8">192 Endpoints</text>

  <rect x="533" y="180" width="134" height="38" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.8" />
  <text x="600" y="197" text-anchor="middle" class="h2" font-size="11">WebSocket (/ws)</text>
  <text x="600" y="210" text-anchor="middle" class="badge" fill="#34d399">Full-Duplex Stream</text>

  <rect x="674" y="180" width="134" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" />
  <text x="741" y="197" text-anchor="middle" class="h2" font-size="11">SSE Stream (/listen)</text>
  <text x="741" y="210" text-anchor="middle" class="badge" fill="#fbbf24">EventSource Pipe</text>

  <!-- Sub-Block 2: Speed Engines & Fast-Path -->
  <rect x="378" y="242" width="444" height="96" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <circle cx="394" cy="258" r="4" fill="#10b981" />
  <text x="406" y="262" class="badge" fill="#34d399">2. SPEED ENGINES &amp; TIMEOUT PROTECTION</text>
  
  <rect x="392" y="272" width="206" height="52" rx="6" fill="#1e293b" />
  <text x="404" y="291" class="h2" font-size="11" fill="#f8fafc">Fast-Path /overview</text>
  <text x="404" y="306" class="text-xs" fill="#94a3b8">tokio::join! concurrent queries</text>
  <text x="404" y="318" class="badge" fill="#10b981">&lt; 1.5ms Snapshot</text>

  <rect x="608" y="272" width="200" height="52" rx="6" fill="#1e293b" />
  <text x="620" y="291" class="h2" font-size="11" fill="#f8fafc">15s Anti-Hang Guard</text>
  <text x="620" y="306" class="text-xs" fill="#94a3b8">Prevents router CPU locks</text>
  <text x="620" y="318" class="badge" fill="#38bdf8">Zero Freeze Guarantee</text>

  <!-- Sub-Block 3: Dynamic Persistent Connection Pool -->
  <rect x="378" y="350" width="444" height="126" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1.2" />
  <circle cx="394" cy="368" r="4" fill="#ea580c" />
  <text x="406" y="372" class="badge" fill="#fb923c">3. DYNAMIC PERSISTENT CONNECTION POOL</text>
  <text x="392" y="392" class="text-xs" fill="#94a3b8">
    Keeps warm authenticated TCP sockets per user@host:port in Arc&lt;Mutex&lt;Pool&gt;&gt;.
  </text>

  <rect x="392" y="402" width="206" height="60" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="0.8" />
  <text x="404" y="421" class="h2" font-size="11">Zero Handshake Churn</text>
  <text x="404" y="437" class="text-xs" fill="#cbd5e1">No 3-way TCP teardown delay</text>
  <text x="404" y="452" class="badge" fill="#f97316">Saved: ~45ms per request</text>

  <rect x="608" y="402" width="200" height="60" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="0.8" />
  <text x="620" y="421" class="h2" font-size="11">Zero Re-Auth MD5</text>
  <text x="620" y="437" class="text-xs" fill="#cbd5e1">No redundant challenge hash</text>
  <text x="620" y="452" class="badge" fill="#f97316">Saved: ~30ms CPU load</text>

  <!-- Sub-Block 4: Wire Codec & .tag Multiplexer -->
  <rect x="378" y="488" width="444" height="132" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
  <circle cx="394" cy="506" r="4" fill="#6366f1" />
  <text x="406" y="510" class="badge" fill="#818cf8">4. WIRE CODEC &amp; .tag MULTIPLEXER</text>
  <text x="392" y="528" class="text-xs" fill="#94a3b8">
    Single socket concurrently routes multiple distinct requests via atomic tags.
  </text>

  <rect x="392" y="538" width="130" height="68" rx="6" fill="#1e293b" />
  <text x="404" y="558" class="h2" font-size="10.5">Tag #101</text>
  <text x="404" y="574" class="text-xs">/ip/address</text>
  <text x="404" y="592" class="badge" fill="#10b981">HTTP Res</text>

  <rect x="535" y="538" width="130" height="68" rx="6" fill="#1e293b" />
  <text x="547" y="558" class="h2" font-size="10.5">Tag #102</text>
  <text x="547" y="574" class="text-xs">monitor-traffic</text>
  <text x="547" y="592" class="badge" fill="#38bdf8">WS Stream</text>

  <rect x="678" y="538" width="130" height="68" rx="6" fill="#1e293b" />
  <text x="690" y="558" class="h2" font-size="10.5">Tag #103</text>
  <text x="690" y="574" class="text-xs">hotspot/active</text>
  <text x="690" y="592" class="badge" fill="#f59e0b">Overview</text>

  <!-- ================= RIGHT COLUMN: MIKROTIK ROUTEROS ================= -->
  <!-- Outer Frame -->
  <rect x="890" y="90" width="260" height="550" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Column Title -->
  <rect x="906" y="106" width="228" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
  <text x="1020" y="127" text-anchor="middle" class="h2" font-size="12" fill="#e2e8f0">MIKROTIK ROUTEROS FLEET</text>
  <text x="1020" y="152" text-anchor="middle" class="text-xs" fill="#64748b">RouterOS v6 &amp; v7 Hardware/Cloud</text>

  <!-- Card 1: Local Router -->
  <rect x="906" y="165" width="228" height="92" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <circle cx="928" cy="188" r="12" fill="#047857" />
  <text x="928" y="193" text-anchor="middle" font-size="13" fill="#ffffff">📡</text>
  <text x="948" y="186" class="h2" font-size="12.5">Local Hardware</text>
  <text x="948" y="200" class="text-xs">CCR / RB4011 / hEX / hAP</text>
  <rect x="916" y="216" width="208" height="28" rx="5" fill="#1e293b" />
  <text x="926" y="234" class="badge" fill="#34d399">PORT 8728 (API Wire Protocol)</text>

  <!-- Card 2: Remote / VPN Router -->
  <rect x="906" y="270" width="228" height="92" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <circle cx="928" cy="293" r="12" fill="#0369a1" />
  <text x="928" y="298" text-anchor="middle" font-size="13" fill="#ffffff">🌐</text>
  <text x="948" y="291" class="h2" font-size="12.5">Remote Router (VPN)</text>
  <text x="948" y="305" class="text-xs">Branch Office / Remote Site</text>
  <rect x="916" y="321" width="208" height="28" rx="5" fill="#1e293b" />
  <text x="926" y="339" class="badge" fill="#38bdf8">PORT 51121 (NAT / Forwarded)</text>

  <!-- Card 3: Cloud Hosted (CHR) -->
  <rect x="906" y="375" width="228" height="92" rx="9" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
  <circle cx="928" cy="398" r="12" fill="#6b21a8" />
  <text x="928" y="403" text-anchor="middle" font-size="13" fill="#ffffff">☁️</text>
  <text x="948" y="396" class="h2" font-size="12.5">Cloud Hosted (CHR)</text>
  <text x="948" y="410" class="text-xs">AWS / Hetzner / DigitalOcean</text>
  <rect x="916" y="426" width="208" height="28" rx="5" fill="#1e293b" />
  <text x="926" y="444" class="badge" fill="#c084fc">PORT 8729 (API-SSL Encrypted)</text>

  <!-- CPU Protection Metric Box -->
  <rect x="906" y="480" width="228" height="140" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="922" y="504" class="badge" fill="#6ee7b7">ROUTER CPU SAVINGS:</text>
  <text x="922" y="528" class="h2" font-size="18" fill="#34d399">~85% CPU Reduction</text>
  <text x="922" y="550" class="text-xs" fill="#a7f3d0">• Zero voucher disconnect spikes</text>
  <text x="922" y="568" class="text-xs" fill="#a7f3d0">• FastTrack Connection bypass</text>
  <text x="922" y="586" class="text-xs" fill="#a7f3d0">• Budget router anti-hang safe</text>

  <!-- ================= FLOW CONNECTORS / ARROWS ================= -->
  <!-- Client to Rust Engine -->
  <path d="M 310 210 L 360 210" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
  <path d="M 310 310 L 360 310" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
  <path d="M 310 410 L 360 410" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
  
  <rect x="306" y="248" width="58" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
  <text x="335" y="262" text-anchor="middle" class="badge" fill="#38bdf8">&lt; 1ms RT</text>

  <!-- Rust Engine to MikroTik Routers -->
  <path d="M 840 210 L 890 210" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)" />
  <path d="M 840 315 L 890 315" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)" />
  <path d="M 840 420 L 890 420" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)" />

  <rect x="836" y="258" width="60" height="20" rx="4" fill="#0f172a" stroke="#f97316" stroke-width="0.8" />
  <text x="866" y="272" text-anchor="middle" class="badge" fill="#f97316">Warm TCP</text>

</svg>
