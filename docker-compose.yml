services:
  mikrotik-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: salmanmustapa/mikrotik-universal-gateway:latest
    container_name: mikrotik-universal-gateway
    restart: unless-stopped
    ports:
      # Port HTTP & WebSocket Gateway (dapat diubah via GATEWAY_PORT di .env, default 8080)
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GATEWAY_LISTEN=0.0.0.0:8080
      # Opsional: Master Admin Token jika gateway ingin diproteksi token (min. 32 karakter).
      # Jika dikosongkan (default), gateway aktif dalam Public Service Mode (terbuka untuk testing & ephemeral tickets).
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-}
      - RUST_LOG=info
      # Opsional: token READ-ONLY untuk browser/aplikasi yang hanya menampilkan peta.
      # - GATEWAY_VIEWER_TOKEN=${GATEWAY_VIEWER_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Layout peta jaringan & gambar denah (hilang jika volume ini dihapus)
      - gateway-data:/data
    # Panduan Reverse Proxy TLS (Caddy):
    # gateway.domain.com {
    #     reverse_proxy 127.0.0.1:8080
    # }
    # Opsional: Uncomment jika ingin mapping file config statis dari host.
    # PENTING: Pastikan config.toml berupa file di host (`cp config.example.toml config.toml`), bukan folder.
    # Opsional: tambahkan mapping config statis dari host ke daftar volumes di atas:
    #   - ./config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  gateway-data:
