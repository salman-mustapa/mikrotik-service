services:
  mikrotik-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: salmanmustapa/mikrotik-universal-gateway:latest
    container_name: mikrotik-universal-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_LISTEN=0.0.0.0:8080
      - GATEWAY_TOKEN=change-me-to-a-long-random-string
      - RUST_LOG=info
    volumes:
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
